# Compila o APK do Desbrava e publica no Releases.
#
# Por que isso existe: o Gradle não roda no ambiente do Claude (o
# launcher sempre bifurca um daemon e conversa com ele por um socket
# loopback, que lá é bloqueado). Tirando só esse passo da máquina
# local, o ciclo inteiro -- editar, commitar, buildar, publicar --
# passa a caber no remote-control, sem ninguém abrir o PowerShell.
#
# Pré-requisito (UMA vez): o Secret GOOGLE_SERVICES_JSON no repositório,
# com o conteúdo de android/app/google-services.json em base64 -- esse
# arquivo é gitignorado de propósito, mas o plugin do Firebase exige
# ele pra compilar.
#
# O build local (Windows) continua valendo e é mais rápido; este aqui é
# o caminho quando não dá pra usar o PC.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "android/**"
      - "tools/montar-www.js"
      - ".github/workflows/build-apk.yml"

# Necessário pro passo final criar/atualizar o release com o
# GITHUB_TOKEN automático (sem token pessoal).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # AGP 8.13 exige JDK 17+; 21 é o mesmo do JBR usado no build local.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 36 pode não vir pronto no runner -- esta action
      # instala o que faltar e aceita as licenças do SDK.
      - uses: android-actions/setup-android@v3

      - name: Restaura o google-services.json (gitignorado)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Monta o www/ e sincroniza o Capacitor
        run: |
          node tools/montar-www.js
          npx cap sync android

      - name: Compila o APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # A versão manda na tag: mesma fonte que o publicar-apk.ps1 usa,
      # pra web e APK nunca divergirem.
      - name: Lê a versão do build.gradle
        id: versao
        run: echo "v=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      # O nome precisa ser exatamente Desbrava.apk: é o que o link
      # /releases/latest/download/Desbrava.apk serve, e é pra ele que o
      # botão "Baixar app" do site aponta (URL_APK em js/script.js).
      - name: Renomeia pro nome que o link "latest" serve
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Desbrava.apk

      - name: Publica no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.versao.outputs.v }}"
          # Repetir a mesma versão não é erro: só troca o arquivo do
          # release que já existe (mesma lógica do publicar-apk.ps1).
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Desbrava.apk --clobber
          else
            gh release create "$tag" Desbrava.apk \
              --title "Desbrava ${{ steps.versao.outputs.v }}" \
              --notes "APK do Desbrava versão ${{ steps.versao.outputs.v }}."
          fi

      # Cópia avulsa pra baixar direto da execução, útil quando o
      # release ainda não interessa (teste de branch, build manual).
      - uses: actions/upload-artifact@v4
        with:
          name: Desbrava-v${{ steps.versao.outputs.v }}
          path: Desbrava.apk
