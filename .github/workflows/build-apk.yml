# Compila o APK do Desbrava e publica no Releases.
#
# Por que isso existe: o Gradle não roda no ambiente do Claude (o
# launcher sempre bifurca um daemon e conversa com ele por um socket
# loopback, que lá é bloqueado). Tirando só esse passo da máquina
# local, o ciclo inteiro -- editar, commitar, buildar, publicar --
# passa a caber no remote-control, sem ninguém abrir o PowerShell.
#
# Pré-requisito (UMA vez): o Secret GOOGLE_SERVICES_JSON no repositório,
# com o conteúdo de android/app/google-services.json em base64 -- esse
# arquivo é gitignorado de propósito, mas o plugin do Firebase exige
# ele pra compilar.
#
# O build local (Windows) continua valendo e é mais rápido; este aqui é
# o caminho quando não dá pra usar o PC.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "assets/**"
      - "android/**"
      - "tools/montar-www.js"
      - ".github/workflows/build-apk.yml"

# Necessário pro passo final criar/atualizar o release com o
# GITHUB_TOKEN automático (sem token pessoal).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 22+ é exigência do Capacitor CLI ("The Capacitor CLI requires
      # NodeJS >=22.0.0" -- o cap sync morre no 20).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # AGP 8.13 exige JDK 17+; 21 é o mesmo do JBR usado no build local.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 36 pode não vir pronto no runner -- esta action
      # instala o que faltar e aceita as licenças do SDK.
      - uses: android-actions/setup-android@v3

      # O segredo vai por env, não interpolado direto no comando: assim
      # o shell não vê o valor como texto (nada de aspas/quebra de linha
      # atrapalhando) e o printf não acrescenta o \n que o echo põe.
      - name: Restaura o google-services.json (gitignorado)
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GS_JSON_B64" | base64 -d > android/app/google-services.json
          # Falha aqui é bem mais fácil de ler do que lá na frente, no
          # meio do erro do plugin do Firebase.
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))" \
            && echo "google-services.json restaurado e valido"

      - name: Monta o www/ e sincroniza o Capacitor
        run: |
          node tools/montar-www.js
          npx cap sync android

      - name: Compila o APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      # A versão manda na tag: mesma fonte que o publicar-apk.ps1 usa,
      # pra web e APK nunca divergirem.
      - name: Lê a versão do build.gradle
        id: versao
        run: echo "v=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      # Dois nomes de propósito:
      # - Desbrava.apk: o que o link /releases/latest/download/ serve,
      #   pra onde o botão "Baixar app" do site aponta (URL_APK).
      # - Desbrava-v<ver>.apk: nome único por versão. O fixo faz toda
      #   versão baixar por cima do mesmo arquivo no celular, e o
      #   Android acaba oferecendo o antigo ("já é a mesma versão" --
      #   aconteceu na 0.11.17). O app prefere este quando existe
      #   (descobrirUrlApkVersionado em js/script.js).
      - name: Prepara os dois nomes do APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Desbrava.apk
          cp Desbrava.apk "Desbrava-v${{ steps.versao.outputs.v }}.apk"

      - name: Publica no Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.versao.outputs.v }}"
          apks=(Desbrava.apk "Desbrava-v${{ steps.versao.outputs.v }}.apk")
          # Repetir a mesma versão não é erro: só troca o arquivo do
          # release que já existe (mesma lógica do publicar-apk.ps1).
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${apks[@]}" --clobber
          else
            gh release create "$tag" "${apks[@]}" \
              --title "Desbrava ${{ steps.versao.outputs.v }}" \
              --notes "APK do Desbrava versão ${{ steps.versao.outputs.v }}."
          fi

      # Cópia avulsa pra baixar direto da execução, útil quando o
      # release ainda não interessa (teste de branch, build manual).
      - uses: actions/upload-artifact@v4
        with:
          name: Desbrava-v${{ steps.versao.outputs.v }}
          path: Desbrava.apk
