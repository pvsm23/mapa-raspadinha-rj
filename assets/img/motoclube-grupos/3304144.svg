<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1170 560" width="1170" height="560">
  <defs>
    <path id="arco-cima" d="M 403 280 A 182 182 0 0 1 767 280" fill="none"/>
    <path id="arco-baixo" d="M 366 280 A 219 219 0 0 0 804 280" fill="none"/>
    <clipPath id="meia-esquerda"><rect x="0" y="0" width="585" height="560"/></clipPath>
    <!-- A arte das asas entra UMA vez e é reusada nas duas metades. Ela
         é o pedaço mais pesado do arquivo, e repetir o base64 engordava
         cada brasão em 6 KB: 550 KB somando os 92. -->
    <image id="asas-arte" xlink:href="data:image/png;base64,"
           x="37" y="63.5"
           width="944" height="469"/>
  </defs>

  <!-- Asas em duas metades, cada uma empurrada pro seu lado. A da
       direita é a MESMA imagem espelhada, o que garante simetria
       exata. Vêm antes do disco: ele cobre a raiz das duas, e é isso
       que faz a asa parecer sair de trás do brasão. -->
  <g clip-path="url(#meia-esquerda)"><use xlink:href="#asas-arte"/></g>
  <g transform="translate(1170 0) scale(-1 1)">
    <g clip-path="url(#meia-esquerda)"><use xlink:href="#asas-arte"/></g>
  </g>

  <circle cx="585" cy="280" r="246" fill="#0F1216" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="585" cy="280" r="162" fill="none" stroke="#FFFFFF" stroke-width="7"/>

  <text x="585" y="268" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF"
        font-size="22" letter-spacing="2">MOTOCLUBE</text>

  <image xlink:href="data:image/png;base64,"
         x="469" y="276" width="232" height="28"/>

  <image xlink:href="data:image/png;base64,"
         x="537" y="316"
         width="96" height="103"/>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF"
        font-size="40" letter-spacing="3">
    <textPath xlink:href="#arco-cima" startOffset="50%" text-anchor="middle">BORA VIVER!</textPath>
  </text>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF"
        font-size="34" letter-spacing="1">
    <textPath xlink:href="#arco-baixo" startOffset="50%" text-anchor="middle">QUEIMADOS - RJ</textPath>
  </text>

  <!-- 20 | 26: o ano de fundação partido nas duas laterais do anel. -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF"
     font-size="38" text-anchor="middle">
    <text x="383" y="293.3">20</text>
    <text x="787" y="293.3">26</text>
  </g>
</svg>
